# config.ini

[SERVER]
HOST = 0.0.0.0
PORT = 5001

# DISPLAY_HOST: O IP que será exibido na mensagem de inicialização.
# - Use 'auto' para detectar o IP da rede local automaticamente.
# - Ou coloque um IP específico (ex: 192.168.1.10) se a detecção automática falhar.
# - Deixe em branco para usar o valor de HOST.
DISPLAY_HOST = auto

SECRET_KEY = sua-chave-secreta-super-segura-aqui

[DATABASE]
FILE = datalogger.db

[APPLICATION]
NUM_CHANNELS = 22
COLLECTOR_TIMEOUT_SECONDS = 15
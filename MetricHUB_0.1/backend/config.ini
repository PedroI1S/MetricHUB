# config.ini (backend)

[SERVER]
HOST = 0.0.0.0
PORT = 5001
# Use 'auto' para detectar o IP local automaticamente; ou defina explicitamente.
DISPLAY_HOST = auto

# Caminho para os arquivos estáticos exportados do frontend (Next.js 'next export').
# Relativo a este arquivo. Ajuste conforme sua implantação.
STATIC_DIR = ../frontend/out

SECRET_KEY = sua-chave-secreta-super-segura-aqui

[DATABASE]
# PostgreSQL Connection
HOST = localhost
PORT = 5433
USER = metrichub_user
PASSWORD = metrichub_password
DBNAME = metrichub_db

[APPLICATION]
NUM_CHANNELS = 22
COLLECTOR_TIMEOUT_SECONDS = 15
